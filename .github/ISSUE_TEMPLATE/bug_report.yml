name: Bug report
description: Something in SumCtrl doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        **Before you post:** this issue is public. Please remove personal details from your text and screenshots: names, addresses and anything else private in your sums or history.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can I make it happen too?
      placeholder: |
        1. Type 12 + 3 on the Calculator tab
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?
  - type: input
    id: app-version
    attributes:
      label: SumCtrl version
      description: Tap your profile picture; the version is at the bottom of the You page.
      placeholder: "Profile picture > bottom of the You page, e.g. 0.1.0"
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version and phone
      placeholder: "Android 15, Pixel 8"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options:
        - GitHub Releases
        - Obtainium
        - CtrlF-Droid
        - Built it myself
  - type: textarea
    id: logs
    attributes:
      label: Screenshots or logs
      description: Drag images in here. Remember to hide personal details first.
